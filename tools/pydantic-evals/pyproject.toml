[project]
name = "pydantic-evals-spike"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai-slim[anthropic]>=2.68.0",
    "pydantic-evals>=2.68.0",
]

[tool.pyright]
# own section so pyright stops walking up to the root config (whose venv lacks this tool)
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
