# P8: nightly, report only. Every case (regression + capability), 3 trials, plus the Haiku reply judge on every reply.
# Its per-case results become the baseline the PR gate compares against (artifact `baseline`).
# To stop it: gh workflow disable evals-nightly.yml (the PR gate then falls back to ci/baseline.json).
name: evals-nightly

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes no floating major tag
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked

      - name: Evals and judge (report only; fails only on infra errors)
        run: uv run python scripts/ci.py nightly --out runs/ci/nightly

      - uses: actions/upload-artifact@v7
        with:
          name: baseline
          path: runs/ci/nightly/baseline.json
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runs
          path: runs/
          if-no-files-found: ignore
          retention-days: 30
